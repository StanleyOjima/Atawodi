:root{--display:'Author',ui-sans-serif,system-ui,sans-serif;--sans:'Author',ui-sans-serif,system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,Menlo,monospace;--accent:#c9b896;--accent-hi:#dccba4;--px:clamp(24px,6vw,96px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#080808;color:#f2f1ed;color-scheme:dark}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit;text-decoration:none}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:0;right:0;top:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--px);z-index:3;border-bottom:1px solid rgba(255,255,255,.06);background:linear-gradient(180deg,rgba(8,8,8,.8),rgba(8,8,8,0))}
.hud .mark{width:30px;height:22px;fill:none;stroke:#f2f1ed;stroke-width:1.6}
.hud .ret{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#a9a69e;transition:color .3s}
.hud .ret:hover,.hud .ret:focus-visible{color:var(--accent-hi);outline:none}
main{position:relative;z-index:2;height:100%;display:flex;align-items:center;padding:56px var(--px) 0}
.txt{max-width:min(560px,46vw)}
.kick{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#8a877f}
.kick b{font-weight:500;color:var(--accent);letter-spacing:.1em}
h1{margin-top:22px;font-family:var(--display);font-weight:400;font-size:clamp(38px,4.4vw,66px);line-height:1.02;letter-spacing:-.026em;color:#f4f2ec;text-wrap:balance}
.lede{margin-top:22px;max-width:44ch;font-size:17px;line-height:1.6;color:#bdb9b0;text-wrap:pretty}
.acts{display:flex;align-items:center;flex-wrap:wrap;gap:16px 28px;margin-top:34px}
.ol{display:inline-flex;align-items:center;gap:14px;font-size:16px;font-weight:500;color:#f2f1ed}
.ol .ring{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid rgba(220,203,164,.5);color:var(--accent-hi);transition:border-color .3s,transform .5s cubic-bezier(.2,.6,.2,1)}
.ol:hover .ring,.ol:focus-visible .ring{border-color:var(--accent-hi);transform:translateX(3px)}
.ol:focus-visible{outline:none}
.ol:focus-visible span:last-child{text-decoration:underline;text-underline-offset:5px;text-decoration-color:var(--accent)}
.sec{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#a9a69e;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.14);transition:color .3s,border-color .3s}
.sec:hover,.sec:focus-visible{color:var(--accent-hi);border-color:var(--accent);outline:none}
.ro{position:fixed;z-index:2;right:var(--px);bottom:clamp(24px,5vh,44px);width:min(380px,32vw);border:1px solid rgba(255,255,255,.1);background:rgba(8,8,8,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ro div{display:grid;grid-template-columns:104px 1fr;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
.ro div+div{border-top:1px solid rgba(255,255,255,.08)}
.ro dt{color:#6f6c64;padding:11px 14px;border-right:1px solid rgba(255,255,255,.08)}
.ro dd{color:#cfccc4;padding:11px 14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ro dd i{font-style:normal;display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent-hi);margin-right:10px;box-shadow:0 0 10px rgba(220,203,164,.8);animation:p 2.4s ease-in-out infinite}
@keyframes p{50%{opacity:.35}}
.txt>*{opacity:0;transform:translateY(14px);transition:opacity .9s ease,transform 1.1s cubic-bezier(.2,.7,.2,1)}
.ready .txt>*{opacity:1;transform:none}
.ready .txt>:nth-child(2){transition-delay:.08s}.ready .txt>:nth-child(3){transition-delay:.16s}.ready .txt>:nth-child(4){transition-delay:.24s}
.ro{opacity:0;transition:opacity 1s .5s}.ready .ro{opacity:1}
@media(max-width:860px){
  body{overflow:auto}
  .hud{height:54px;padding:0 20px}
  main{align-items:flex-end;padding:0 24px calc(32px + env(safe-area-inset-bottom,0px));min-height:100%}
  .txt{max-width:none}
  h1{font-size:34px;margin-top:16px}
  .lede{font-size:16px;margin-top:16px}
  .acts{margin-top:24px}
  main{flex-direction:column;justify-content:flex-start;align-items:stretch;padding-top:var(--chart,52svh)}
  .ro{position:static;width:auto;margin-top:28px;background:none;-webkit-backdrop-filter:none;backdrop-filter:none}
  .ro div{grid-template-columns:92px 1fr;font-size:9.5px}
  .ro dt,.ro dd{padding:10px 12px}
}
@media (min-width:861px) and (max-height:640px){ .ro{display:none} }
@media (prefers-reduced-motion: reduce){ .ro dd i{animation:none} .txt>*,.ro{transition:none} }
</style>
</head>

    <h1>This part of the map is still being drawn.</h1>
    <p class="lede">The case studies and deeper pages are in development and will open here soon. Until then, the atlas holds the outline of every system.</p>

<script>
(function(){
  "use strict";
  var req = document.getElementById('req'), clk = document.getElementById('clk');
  if (req) req.textContent = (location.pathname || '/') + (location.search || '');
  function tick(){ try { clk.textContent = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Africa/Lagos' }).format(new Date()) + ' WAT'; } catch (e) {} }
  tick(); setInterval(tick, 20000);

  /* the atlas, in plan: five charted orbits, and a sixth that a drafting arm is still drawing.

  var cv = document.getElementById('sky'), ctx = cv.getContext('2d');
